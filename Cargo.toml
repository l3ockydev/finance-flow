[package]
name = "finance_flow"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[[bin]]
name = "finance_flow"
path = "main.rs"

[dependencies]
eframe = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--subsystem,windows"]
